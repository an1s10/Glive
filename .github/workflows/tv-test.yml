name: Test sur émulateur TV

on:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tv:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer l'APK de la dernière version
        run: curl -sSL -o Glive.apk https://github.com/an1s10/Glive/releases/latest/download/Glive.apk
      - name: Vidéos de test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440 -t 120 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -f mpegts test.ts
          ffmpeg -loglevel error -f lavfi -i testsrc=size=1280x720:rate=25 -f lavfi -i sine=frequency=660 -t 600 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -movflags +faststart test.mp4
      - name: Données foot de test (ESPN)
        run: |
          mkdir -p shots
          curl -s -m 20 -o shots/espn_ucl.json "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard?dates=$(date -d '-1 day' +%Y%m%d)-$(date -d '+8 day' +%Y%m%d)&limit=200&lang=fr&region=fr" || echo "echec" > shots/espn_ucl.json
          curl -s -m 20 -o shots/espn_liga.json "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/scoreboard?dates=$(date -d '-1 day' +%Y%m%d)-$(date -d '+8 day' +%Y%m%d)&limit=200&lang=fr&region=fr" || true
      - name: Faux serveur Xtream
        run: nohup python3 tools/mock_xtream.py http://10.0.2.2:8000 > mock.log 2>&1 &
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Émulateur Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/tv_test.sh
      - name: Publier les captures sur la branche tv-shots
        if: always()
        run: |
          mkdir -p /tmp/pub && cp -r shots/. /tmp/pub/ 2>/dev/null || true
          cp mock.log /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub
          git init -q -b tv-shots
          git config user.name "glive-bot"; git config user.email "bot@glive.local"
          git add -A && git commit -qm "Captures ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tv-shots
