name: Sonde API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger les API
        run: |
          mkdir -p out && cd out
          D1=$(date -d '-1 day' +%Y%m%d); D2=$(date -d '+8 day' +%Y%m%d)
          B=https://site.api.espn.com/apis/site/v2/sports/soccer
          curl -s --compressed -m 20 "$B/uefa.champions/scoreboard" -o a_plain.json
          curl -s --compressed -m 20 "$B/uefa.champions/scoreboard?dates=$D1-$D2" -o b_dates.json
          curl -s --compressed -m 20 "$B/uefa.champions/scoreboard?dates=$D1-$D2&limit=200" -o c_limit.json
          curl -s --compressed -m 20 "$B/uefa.champions/scoreboard?dates=$D1-$D2&lang=fr&region=fr" -o d_lang.json
          curl -s --compressed -m 20 "$B/esp.1/scoreboard?dates=$D1-$D2" -o e_liga.json
          curl -s --compressed -m 20 "$B/esp.1/teams/86/schedule?fixture=true" -o f_real_fixture.json
          curl -s --compressed -m 20 "$B/alg.1/scoreboard" -o g_alg.json
          curl -s --compressed -m 20 "$B/caf.nations/scoreboard" -o h_can.json
          for f in *.json; do echo "$f $(head -c 120 $f)"; done > summary.txt
          git init -q -b probe; git config user.name bot; git config user.email bot@x
          git add -A; git commit -qm probe
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe
